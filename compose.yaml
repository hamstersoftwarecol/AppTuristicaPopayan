services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: turismo
            POSTGRES_USER: turismo
            POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Configura LOCAL_DB_PASSWORD en .env}
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - tourism-postgres:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U turismo -d turismo']
            interval: 5s
            timeout: 5s
            retries: 10
    redis:
        image: redis:7-alpine
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - tourism-redis:/data
        command: ['redis-server', '--appendonly', 'yes']
volumes:
    tourism-postgres:
    tourism-redis:
